name: Deployment image

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Verify backend and web
        run: |
          npm ci
          npm ci --prefix web
          npm run check
          npm run build
          npm run check --prefix web
          npm run build --prefix web
      - uses: docker/setup-qemu-action@68827325e0b33c7199eb31dd4e31fbe9023e06e3 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ARM64 image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/imprun/publication-web:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/imprun/publication
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Sign and verify immutable image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          image="ghcr.io/imprun/publication-web@${IMAGE_DIGEST}"
          cosign sign --yes "${image}"
          cosign verify \
            --certificate-identity="https://github.com/imprun/publication/.github/workflows/deployment-image.yml@refs/heads/main" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${image}"
      - name: Publish release evidence
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo "## Publication deployment image"
            echo
            echo "- Revision: \`${GITHUB_SHA}\`"
            echo "- Image: \`ghcr.io/imprun/publication-web@${IMAGE_DIGEST}\`"
            echo "- Platform: \`linux/arm64\`"
            echo "- Signature: verified"
          } >> "${GITHUB_STEP_SUMMARY}"
